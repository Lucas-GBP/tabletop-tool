name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      package:
        description: Gerar instaladores de teste sem publicar release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global $(node --print "require('./package.json').packageManager")
      - name: Install frontend dependencies
        run: npm ci
      - parallel:
          - name: Check repository formatting
            run: npm run check:format:ts
          - name: Lint TypeScript and React
            run: npm run lint
          - name: Lint SCSS modules
            run: npm run lint:styles
      - name: Check TypeScript
        run: npm run typecheck
      - parallel:
          - name: Run frontend tests
            run: npm test
          - name: Build frontend bundle
            run: npm run build:app

  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global $(node --print "require('./package.json').packageManager")
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install project Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install binding tool dependencies
        run: npm ci
      - name: Check default Rust features
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked
      - parallel:
          - name: Check Rust formatting
            run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          - name: Run Clippy
            run: >-
              cargo clippy --manifest-path src-tauri/Cargo.toml --workspace
              --all-targets --all-features --locked -- -D warnings
      - name: Run Rust unit tests
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --workspace
          --all-features --lib --locked
      - name: Run Rust public API tests
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --workspace
          --all-features --test '*' --locked
      - name: Run Rust documentation tests
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --workspace
          --all-features --doc --locked
      - name: Check generated IPC bindings
        run: npm run check:bindings

  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: [frontend, backend]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
            artifact: linux-x64
          - os: windows-2022
            bundles: nsis
            artifact: windows-x64
          #- os: macos-15
          #  bundles: dmg
          #  artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global $(node --print "require('./package.json').packageManager")
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install project Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install desktop dependencies
        run: npm ci
      - name: Test Windows path handling
        if: runner.os == 'Windows'
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --package tabletop-tool
          application::settings::tests::removes_windows_verbatim_prefix_from_stored_setting
          --locked
      - name: Build desktop application
        if: github.event_name != 'workflow_dispatch' || !inputs.package
        run: npm run tauri build -- --debug --no-bundle --ci -- --locked
      - name: Build test installer
        if: github.event_name == 'workflow_dispatch' && inputs.package
        run: npm run tauri build -- --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Upload test installer
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabletop-tool-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
