[package]
name = "tabletop-tool"
version = "0.1.0"
description = "Local desktop application for preparing and running tabletop RPG sessions"
authors = ["Lucas"]
edition = "2021"
rust-version = "1.95"
default-run = "tabletop-tool"

[workspace]
members = [".", "migration"]
resolver = "2"

[workspace.dependencies]
sea-orm = { version = "2.0.3", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio", "with-uuid"] }
sea-orm-migration = { version = "2.0.3", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tabletop_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["bindings"]

[features]
bindings = ["tauri-specta/typescript"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
sea-orm = { workspace = true }
migration = { path = "migration" }
tokio = { workspace = true }
uuid = { workspace = true }
symphonia = { version = "0.5", features = ["all"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25" }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
